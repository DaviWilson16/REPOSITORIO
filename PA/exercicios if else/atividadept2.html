<script>
    var cod = parseFloat(prompt("Insira o Codigo"));
    switch (cod) {
        case 1:
            document.write("cachorro quente R$ 8,00");
            break;
        case 2:
            document.write("cheeseburger R$ 12,00");
            break;
        case 3:
            document.write("x-salada R$ 15,00");
            break;
        case 4:
            document.write("misto quente R$ 11,00");
        case 5:
            document.write("pao na chapa R$ 6,00");
        default:
            document.write("cod invalido");
    }
</script>
