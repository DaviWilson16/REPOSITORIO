<script>
    var idade = parseInt(prompt("insira a idade"));
    switch (idade) {
     case 6:
        document.write("Dente de leite");
        break;
     case 7:
        document.write("Junior");
        break;
     case 8:
        document.write("Junior Max");
        break;
     case 9:
        document.write("Junior Master");
        break;
     case 10:
        document.write("Master");
     default:
            document.write("idade invalida");
    }

</script>
